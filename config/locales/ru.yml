  games:
    soc:
      title: "S.T.A.L.K.E.R.: Тень Чернобыля"
      notes: "Ещё не официально поддерживаемая движком платформа, но работает (см. issue #392 OpenXRay). Конфиги и скрипты берутся из .db-архивов; оверлеем добавляется только gamedata/config/openxray.ltx."
    cs:
      title: "S.T.A.L.K.E.R.: Чистое небо"
      notes: "В движке есть режим -cs, но он не тестировался. Обрабатывается как CoP: распакованные папки подключаются симлинками, .db-архивы ищутся в корне."
    cop:
      title: "S.T.A.L.K.E.R.: Зов Припяти"
      notes: "Родная платформа движка. Копии GOG/Steam содержат распакованные levels/resources/localization/mp/patches и gamedata/configs+scripts; всё это подключается симлинками, обновлённые скрипты движка — оверлеем сверху."
    mod:
      title: Моды
      notes: "Модифицированная копия игры (мод). Мастер установки спросит режим совместимости движка — soc, cs или cop — он задаёт флаг запуска, game_mode в openxray.ltx и структуру fsgame.ltx дистрибутива."
  about:
    text: "Лаунчер OpenXRay %{version} — сборка и запуск дистрибутивов S.T.A.L.K.E.R. на OpenXRay.\nhttps://github.com/OpenXRay/xray-16 — см. LAUNCHER.md"
