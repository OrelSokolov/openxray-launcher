  games:
    soc:
      title: "S.T.A.L.K.E.R.: Shadow of Chernobyl"
      notes: "Not an officially supported engine platform yet, but it runs (see OpenXRay issue #392). Configs and scripts come from the .db archives; only gamedata/config/openxray.ltx is overlaid."
    cs:
      title: "S.T.A.L.K.E.R.: Clear Sky"
      notes: "The engine has a -cs mode, but it is untested. Treated like CoP: unpacked folders are linked, .db archives root-scanned."
    cop:
      title: "S.T.A.L.K.E.R.: Call of Pripyat"
      notes: "The engine's native platform. GOG/Steam installs ship unpacked levels/resources/localization/mp/patches plus gamedata/configs+scripts; all of it is linked and the engine's updated scripts are overlaid on top."
  about:
    text: "OpenXRayLauncher %{version} — assemble and run S.T.A.L.K.E.R. distributions on OpenXRay.\nhttps://github.com/OpenXRay/xray-16 — see LAUNCHER.md"
